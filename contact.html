    <main class="contact-page">
        <hr class="top">
        <h1 class="contact-title">Keep in Touch</h1>
        <hr class="bottom">
        <section class="contact-section">
            <div class="contact-heading">
                <br>
                <br>
                <p>
                    Have a question, want to collaborate, or just want to say hello?
                    I'd love to hear from you!
                </p>
                <br>
                <br>
                <form class="contact-form" action="https://formspree.io/f/xqpqqaev" method="POST">
                <div class="name-fields">
                    <div class="form-group">
                        <label for="first-name">First Name</label>
                            <input type="text" id="first-name" name="first-name" placeholder="Your first name" required>
                    </div>

                <div class="form-group">
                    <label for="last-name">Last Name</label>
                    <input type="text" id="last-name" name="last-name" placeholder="Your last name" required>
                </div>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="email" id="email" name="email" placeholder="you@example.com" required>
            </div>

            <div class="form-group">
                <label for="message">Your Message</label>
                <textarea id="message" name="message" rows="6" placeholder="Write your message here..." required></textarea>
            </div>
            <button type="submit" class="submit-btn">
                Send Message
            </button>

        </form>
    </section>
</main>
